name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify release file hash
        run: cd dist && sha256sum -c burnrail-preview.html.sha256
      - name: Release notes for this tag
        run: awk -v t="## $GITHUB_REF_NAME " 'index($0, t) == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md" && test -s "$RUNNER_TEMP/notes.md"
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" dist/burnrail-preview.html dist/burnrail-preview.html.sha256 --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
  labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ensure issue-form labels exist
        run: |
          gh label create "topic:provider" --repo "$GITHUB_REPOSITORY" --color 1d76db --description "Provider or file format request" --force
          gh label create "topic:next" --repo "$GITHUB_REPOSITORY" --color 5319e7 --description "What should come next (optional spend and price ranges)" --force
          gh label create "topic:bug" --repo "$GITHUB_REPOSITORY" --color d93f0b --description "Something is read or totalled wrongly" --force
        env:
          GH_TOKEN: ${{ github.token }}
